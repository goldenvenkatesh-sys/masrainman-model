# MasRainMan 10-day forecast, four times a day (00/06/12/18 UTC runs), on GitHub's computers, so it runs with the laptop off.
# Uses the model packed in operational/ (python -m masrainman.export_model) and the latest
# ECMWF open-data run. The maps are published on the `live` branch (open it on GitHub to
# see them, also on a phone); the full netCDF output is kept as a run artifact for 14 days.
name: Daily forecast

on:
  # GitHub often starts scheduled runs late (hours, when busy), so there are backup times.
  # A scheduled run stops straight away if the live branch already has the newest ECMWF run.
  # ECMWF open data: 00/12 UTC runs (240 h) are out by about 08:00 / 20:00 UTC, 06/18 UTC runs
  # (90 h; the model takes later boundaries from the run 6 h older) by about 13:00 / 01:00 UTC.
  schedule:
    - cron: "30 8 * * *"    # 14:00 IST  00 UTC run
    - cron: "17 10 * * *"   # 15:47 IST  backup
    - cron: "38 13 * * *"   # 19:08 IST  06 UTC run
    - cron: "21 15 * * *"   # 20:51 IST  backup
    - cron: "35 20 * * *"   # 02:05 IST  12 UTC run
    - cron: "52 22 * * *"   # 04:22 IST  backup
    - cron: "38 1 * * *"    # 07:08 IST  18 UTC run
    - cron: "21 3 * * *"    # 08:51 IST  backup
  workflow_dispatch:        # "Run workflow" button on the Actions tab
    inputs:
      backfill:
        description: "Verification: also archive earlier 00 UTC forecasts kept as artifacts"
        type: boolean
        default: false
  push:                     # and at once whenever a new model or this workflow is pushed
    branches: [main]
    paths: [operational/**, .github/workflows/daily_forecast.yml]

permissions:
  contents: write
  actions: read

concurrency: daily-forecast

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-live.txt

      - name: Newest ECMWF run, already published?
        id: check
        run: |
          pip install -q requests
          # newest complete run: 00/12 UTC (240 h) or 06/18 UTC (90 h)
          cycle=$(python -m masrainman.latest | tail -1)
          [ -n "$cycle" ] || { echo "::error::Could not find the newest ECMWF run"; exit 1; }
          tag=$(echo "$cycle" | tr -d 'T-')
          done=$( (git fetch -q --depth 1 origin live && git show FETCH_HEAD:cycle.txt) 2>/dev/null || true)
          echo "newest ECMWF run $cycle, live branch has '${done}'"
          echo "cycle=$cycle" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$done" = "$tag" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Forecast for $cycle is already published - nothing to do"
          fi

      - name: Install
        if: steps.check.outputs.skip != 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-live.txt

      - name: Forecast
        if: steps.check.outputs.skip != 'true'
        run: python -u -m masrainman.live_forecast --ckpt operational/model.pt --data-dir operational --run-dir out --plot --cycle ${{ steps.check.outputs.cycle }}

      - name: Keep the full output
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: masrainman-forecast
          path: out/live/
          retention-days: 14

      - name: Publish maps to the live branch
        if: steps.check.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          nc=$(ls out/live/fc_??????????.nc | head -1)
          tag=$(basename "$nc" .nc); tag=${tag#fc_}
          mkdir pub
          cp out/live/fc_${tag}_*.png pub/
          cp out/live/fc_${tag}_maps.json pub/manifest.json
          echo "$tag" > pub/cycle.txt   # read by the "already published?" check
          {
            echo "# MasRainMan AI forecast"
            echo
            echo "ECMWF run ${tag:0:4}-${tag:4:2}-${tag:6:2} ${tag:8:2} UTC, made $(date -u '+%Y-%m-%d %H:%M') UTC."
            echo "Rainfall: 24-h totals on the MasRainMan standard colour bar. Full data: the run's artifact on the Actions tab."
            for f in pub/*.png; do
              n=$(basename "$f"); h=${n##*_}; h=${h%h.png}
              echo; echo "## +$((10#$h)) h"; echo; echo "![+$h h]($n)"
            done
          } > pub/README.md
          cd pub
          git init -q -b live
          git config user.name "masrainman-bot"
          git config user.email "masrainman-bot@users.noreply.github.com"
          git add .
          git commit -q -m "Forecast $tag"
          # the live branch only ever holds the latest forecast, so it is replaced each day
          for i in 1 2 3 4; do   # GitHub sometimes answers a push with a passing server error
            git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live && break
            [ "$i" = 4 ] && exit 1
            echo "push failed, retrying in $((i * 20)) s"; sleep $((i * 20))
          done

      # Never fails the forecast: the maps above are already published
      - name: Verification against gauges and airports
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          BACKFILL: ${{ github.event.inputs.backfill }}
        run: bash scripts/verify_ci.sh
