# MasRainMan daily 10-day forecast on GitHub's computers, so it runs with the laptop off.
# Uses the model packed in operational/ (python -m masrainman.export_model) and the latest
# ECMWF open-data run. The maps are published on the `live` branch (open it on GitHub to
# see them, also on a phone); the full netCDF output is kept as a run artifact for 14 days.
name: Daily forecast

on:
  schedule:
    - cron: "30 8 * * *"   # 08:30 UTC = 14:00 IST, after ECMWF's 00 UTC run is published
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:                     # and at once whenever a new model or this workflow is pushed
    branches: [main]
    paths: [operational/**, .github/workflows/daily_forecast.yml]

permissions:
  contents: write

concurrency: daily-forecast

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-live.txt

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-live.txt

      - name: Forecast
        run: python -u -m masrainman.live_forecast --ckpt operational/model.pt --data-dir operational --run-dir out --plot

      - name: Keep the full output
        uses: actions/upload-artifact@v4
        with:
          name: masrainman-forecast
          path: out/live/
          retention-days: 14

      - name: Publish maps to the live branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          nc=$(ls out/live/fc_??????????.nc | head -1)
          tag=$(basename "$nc" .nc); tag=${tag#fc_}
          mkdir pub
          cp out/live/fc_${tag}_*.png pub/
          {
            echo "# MasRainMan AI forecast"
            echo
            echo "ECMWF run ${tag:0:4}-${tag:4:2}-${tag:6:2} ${tag:8:2} UTC, made $(date -u '+%Y-%m-%d %H:%M') UTC."
            echo "Rainfall: 24-h totals on the MasRainMan standard colour bar. Full data: the run's artifact on the Actions tab."
            for f in pub/*.png; do
              n=$(basename "$f"); h=${n##*_}; h=${h%h.png}
              echo; echo "## +$((10#$h)) h"; echo; echo "![+$h h]($n)"
            done
          } > pub/README.md
          cd pub
          git init -q -b live
          git config user.name "masrainman-bot"
          git config user.email "masrainman-bot@users.noreply.github.com"
          git add .
          git commit -q -m "Forecast $tag"
          # the live branch only ever holds the latest forecast, so it is replaced each day
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live
